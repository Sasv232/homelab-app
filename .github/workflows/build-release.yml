name: build-release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create android platform
        run: flutter create --platforms=android --project-name homelab .

      - name: Generate keystore
        run: |
          keytool -genkeypair -v \
            -keystore keystore.jks \
            -alias homelab -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass homelab123 -keypass homelab123 \
            -dname "CN=HomeLab, OU=Home, O=Home, L=Home, ST=Home, C=RU"

      - name: Patch android config (AGP pin + manifest)
        run: python3 .github/patch_android.py

      - name: Build APK (unsigned)
        run: flutter build apk --release

      - name: Sign APK (app-release.apk is debug-signed by template)
        run: |
          ls -la build/app/outputs/flutter-apk/
          APKSIGNER=$(ls $ANDROID_HOME/build-tools/*/apksigner | tail -1)
          ZALIGN=$(ls $ANDROID_HOME/build-tools/*/zipalign | tail -1)
          mkdir -p dist
          $ZALIGN -f 4 build/app/outputs/flutter-apk/app-release.apk dist/aligned.apk
          $APKSIGNER sign \
            --ks keystore.jks --ks-pass pass:homelab123 \
            --ks-key-alias homelab --key-pass pass:homelab123 \
            --out dist/homelab-app.apk dist/aligned.apk
          $APKSIGNER verify dist/homelab-app.apk

      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: dist/homelab-app.apk

      - name: Upload to Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/homelab-app.apk

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create windows platform
        run: flutter create --platforms=windows --project-name homelab .

      - name: Patch windows config
        run: python .github/patch_windows.py

      - name: Build Windows EXE
        run: flutter build windows --release

      - name: Prepare artifact
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Compress-Archive -Path build\windows\x64\runner\Release\* -DestinationPath dist\homelab-app-windows.zip

      - uses: actions/upload-artifact@v4
        with:
          name: windows-exe
          path: dist/homelab-app-windows.zip

      - name: Upload to Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/homelab-app-windows.zip