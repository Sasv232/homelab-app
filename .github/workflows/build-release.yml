name: build-release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create android platform
        run: flutter create --platforms=android --org com.homelab --project-name homelab_app ..

      - name: Patch android config
        run: python3 .github/patch_android.py

      - name: Build APK
        run: flutter build apk --release

      - name: Prepare artifact
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk dist/homelab-app.apk

      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: dist/homelab-app.apk

      - name: Upload to Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/homelab-app.apk

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create windows platform
        run: flutter create --platforms=windows --org com.homelab --project-name homelab_app ..

      - name: Build Windows EXE
        run: flutter build windows --release

      - name: Prepare artifact
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Compress-Archive -Path build\windows\x64\runner\Release\* -DestinationPath dist\homelab-app-windows.zip

      - uses: actions/upload-artifact@v4
        with:
          name: windows-exe
          path: dist/homelab-app-windows.zip

      - name: Upload to Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/homelab-app-windows.zip